{% assign image_project = include.project %}
{% if image_project.cover_image %}
<figure class="project-artwork">
  <a class="project-artwork-link" href="{{ image_project.cover_image | relative_url }}" target="_blank" rel="noopener noreferrer" data-lightbox data-image-title="{{ image_project.name | escape }}" aria-label="Enlarge {{ image_project.name | escape }} project image">
    <img src="{{ image_project.cover_image | relative_url }}" alt="{{ image_project.name | escape }} project illustration" width="1376" height="768" loading="lazy" decoding="async">
    <span class="image-expand" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 3l6 6m12-6-6 6M3 21l6-6m12 6-6-6"/></svg>Expand</span>
  </a>
</figure>
{% endif %}
